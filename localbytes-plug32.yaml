substitutions:
  name: "localbytes-plug32"
  friendly_name: "LocalBytes Plug32"
  main_icon: "power-socket-uk"

  # Options: `RESTORE_DEFAULT_OFF`, `RESTORE_DEFAULT_ON`, `ALWAYS_ON` & `ALWAYS_OFF`
  default_state: "RESTORE_DEFAULT_OFF"

  throttle_average: 5s

  # Power monitoring scale. These are the board's design values, so no per-plug calibration is needed.
  # voltage_divider: two 1 MOhm resistors over the HLW8032's internal 1 kOhm, giving 2.0.
  # current_resistor: the 1 mOhm shunt (marked R001), in milliohms.
  # Both are also adjustable at runtime from the "Voltage Divider" and "Current Resistor" numbers.
  # These are only the defaults used until a number is changed.
  voltage_divider: "2.0"
  current_resistor: "1.0"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.4.1
  name_add_mac_suffix: true
  project:
    name: localbytes.plug32
    version: "0.1.0"

esp32:
  variant: esp32c3
  flash_frequency: 40MHz
  framework:
    type: esp-idf

factory_reset:

web_server:
  version: 3
  include_internal: true
  sorting_groups:
    - id: group_power
      name: "Power"
      sorting_weight: 10
    - id: group_energy
      name: "Energy"
      sorting_weight: 20
    - id: group_diagnostics
      name: "Diagnostics"
      sorting_weight: 30

logger:

ota:
  - platform: esphome
    allow_partition_access: true

api:

esp32_improv:
  authorizer: button_sensor
  status_indicator: wifi_led

dashboard_import:
  package_import_url: github://LocalBytes/esphome-localbytes-plug32/localbytes-plug32.yaml@main

wifi:
  ap:
    ssid: "${friendly_name}"
  on_connect:
    output.turn_on: wifi_led
  on_disconnect:
    output.turn_off: wifi_led

network:
  enable_ipv6: true

captive_portal:

time:
  - platform: homeassistant
  - platform: sntp

esp32_ble_tracker:

bluetooth_proxy:
  active: true

uart:
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 4800
  parity: EVEN

number:
  - platform: template
    name: "Voltage Divider"
    id: voltage_divider_number
    icon: "mdi:tune"
    entity_category: config
    web_server:
      sorting_group_id: group_diagnostics
    min_value: 1.0
    max_value: 4.0
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${voltage_divider}
    on_value:
      - lambda: id(power_monitor).set_voltage_divider(x);

  - platform: template
    name: "Current Resistor"
    id: current_resistor_number
    icon: "mdi:tune"
    entity_category: config
    unit_of_measurement: "mΩ"
    web_server:
      sorting_group_id: group_diagnostics
    min_value: 0.5
    max_value: 2.0
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${current_resistor}
    on_value:
      - lambda: id(power_monitor).set_current_resistor(x / 1000.0f);

output:
  - platform: gpio
    id: relay_led
    pin:
      number: GPIO18
      inverted: true

  - platform: gpio
    id: wifi_led
    pin:
      number: GPIO10
      inverted: true

binary_sensor:
  - platform: gpio
    id: button_sensor
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    web_server:
      sorting_group_id: group_power
    on_click:
      then:
        switch.toggle: relay

  - platform: status
    name: "Server Status"
    web_server:
      sorting_group_id: group_diagnostics

switch:
  - platform: gpio
    name: ""
    icon: "mdi:${main_icon}"
    pin: GPIO6
    id: relay
    restore_mode: "${default_state}"
    web_server:
      sorting_group_id: group_power
    on_turn_on:
      output.turn_on: relay_led
    on_turn_off:
      output.turn_off: relay_led

sensor:
  - platform: wifi_signal
    name: "WiFi Status"
    update_interval: 60s
    web_server:
      sorting_group_id: group_diagnostics

  - platform: hlw8032
    id: power_monitor
    voltage_divider: ${voltage_divider}
    current_resistor: ${current_resistor}mohm
    voltage:
      name: "Voltage"
      id: voltage
      web_server:
        sorting_group_id: group_energy
      filters:
        - throttle_average: ${throttle_average}
    current:
      name: "Current"
      id: current
      web_server:
        sorting_group_id: group_energy
      filters:
        - throttle_average: ${throttle_average}
    power:
      name: "Power"
      id: power
      web_server:
        sorting_group_id: group_energy
      filters:
        - throttle_average: ${throttle_average}
    apparent_power:
      name: "Power (Apparent)"
      web_server:
        sorting_group_id: group_energy
      filters:
        - throttle_average: ${throttle_average}
    power_factor:
      name: "Power Factor"
      web_server:
        sorting_group_id: group_energy
      filters:
        - throttle_average: ${throttle_average}

  # The HLW8032 has no energy counter, so energy is integrated from power on the plug.
  - platform: integration
    name: "Energy"
    sensor: power
    time_unit: h
    integration_method: trapezoid
    restore: true
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_energy

  - platform: total_daily_energy
    name: "Energy (Daily)"
    device_class: energy
    power_id: power
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    web_server:
      sorting_group_id: group_energy

  - platform: ntc
    sensor: resistance_sensor
    name: "Temperature"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics
    calibration:
      b_constant: 3950
      reference_resistance: 100k
      reference_temperature: 25°C

  - platform: resistance
    id: resistance_sensor
    sensor: adc_sensor
    configuration: DOWNSTREAM
    resistor: 15.8k

  - platform: adc
    id: adc_sensor
    pin: GPIO4
    update_interval: 30s
    attenuation: 12db

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: group_diagnostics
  - platform: factory_reset
    name: "Restart with Factory Default Settings"
    web_server:
      sorting_group_id: group_diagnostics
